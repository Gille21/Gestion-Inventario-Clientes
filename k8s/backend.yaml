apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: corferias-backend:latest
        imagePullPolicy: IfNotPresent # Usa la imagen construida localmente
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: "mssql-service" # Apunta al servicio de BD creado arriba
        - name: SA_PASSWORD
          value: "Corferias123*"
        command: 
          - "sh"
          - "-c"
          - "echo 'Esperando a SQL Server...' && sleep 15 && python manage.py migrate && python manage.py seed_db && python manage.py runserver 0.0.0.0:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000